<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 AI Voice Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body { background: #0f172a; color: #f8fafc; text-align: center; padding: 20px; margin: 0; }
        h2 { font-weight: 600; margin-bottom: 5px; }
        p, .status-box { font-weight: 300; }
        .card { background: #1e293b; max-width: 400px; margin: 30px auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn-mic { 
            width: 100px; height: 100px; border-radius: 50%; border: none; 
            background: #3b82f6; color: white; cursor: pointer; transition: 0.3s; 
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); display: inline-flex; 
            align-items: center; justify-content: center; margin-top: 15px; 
        }
        .btn-mic svg { width: 45px; height: 45px; fill: currentColor; }
        .btn-mic.listening { background: #ef4444; box-shadow: 0 0 20px rgba(239, 68, 68, 0.7); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        .status-box { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 10px; font-size: 16px; min-height: 50px; }
        .state-indicator { margin-top: 15px; font-weight: 600; font-size: 18px; }
        .on { color: #22c55e; }
        .off { color: #ef4444; }
        .auto { color: #3b82f6; }
    </style>
</head>
<body>

<div class="card">
    <h2>AI Voice Control</h2>
    <p>พูดคำสั่ง (เช่น "เปิดไฟ", "ปิดไฟ", "เปิดโหมดออโต้")</p>

    <button id="micBtn" class="btn-mic" onclick="toggleListening()">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
        </svg>
    </button>

    <div class="status-box" id="transcriptText">กดปุ่มไมค์เพื่อเริ่มพูด...</div>

    <div class="state-indicator">
        สถานะระบบ: <span id="deviceStatus" class="off">OFF</span>
    </div>
</div>

<script>
    const micBtn = document.getElementById('micBtn');
    const transcriptText = document.getElementById('transcriptText');
    const deviceStatus = document.getElementById('deviceStatus');

    const BLYNK_TOKEN = "9ksShhZRwGtCGBPw-R0ioSRWy3cwE-L7";

    let recognition;
    let isListening = false;

    // ส่ง Google TTS URL ไปให้ลำโพง ESP32 เล่นอย่างเดียว
    function playAudioOnESP32(text) {
        const encodedText = encodeURIComponent(text);
        const ttsUrl = `http://translate.google.com/translate_tts?ie=UTF-8&q=${encodedText}&tl=th&client=tw-ob`;
        sendDataToBlynk("v5", ttsUrl);
    }

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.lang = 'th-TH';
        recognition.continuous = false;
        recognition.interimResults = false;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('listening');
            transcriptText.innerText = "กำลังฟังเสียงของคุณ...";
        };

        recognition.onresult = (event) => {
            const commandText = event.results[0][0].transcript;
            transcriptText.innerText = `คุณพูดว่า: "${commandText}"`;
            processVoiceCommand(commandText);
        };

        recognition.onerror = (event) => {
            transcriptText.innerText = "เกิดข้อผิดพลาดในการรับเสียง: " + event.error;
            stopListening();
        };

        recognition.onend = () => { stopListening(); };
    } else {
        transcriptText.innerText = "เบราว์เซอร์นี้ไม่รองรับระบบสั่งงานด้วยเสียง";
    }

    function toggleListening() {
        if (!recognition) return;
        if (isListening) { recognition.stop(); } else { recognition.start(); }
    }

    function stopListening() {
        isListening = false;
        micBtn.classList.remove('listening');
    }

    function processVoiceCommand(text) {
        const lowerText = text.toLowerCase();
        
        const autoKeywords    = ["ออโต้", "อัตโนมัติ", "auto", "เซนเซอร์", "เซ็นเซอร์"];
        const turnOnKeywords  = ["เปิดไฟ", "เปิด", "สว่าง", "ติดไฟ", "on"];
        const turnOffKeywords = ["ปิดไฟ", "ปิด", "มืด", "ดับไฟ", "off"];

        let action = null;

        if (autoKeywords.some(keyword => lowerText.includes(keyword))) {
            action = "AUTO";
        } else if (turnOnKeywords.some(keyword => lowerText.includes(keyword))) {
            action = "ON";
        } else if (turnOffKeywords.some(keyword => lowerText.includes(keyword))) {
            action = "OFF";
        }

        if (action === "AUTO") {
            deviceStatus.innerText = "AUTO MODE";
            deviceStatus.className = "auto";
            sendDataToBlynk("v1", 0);
            playAudioOnESP32("เปลี่ยนเป็นโหมดอัตโนมัติแล้วครับ");
        } else if (action === "ON") {
            deviceStatus.innerText = "ON (MANUAL)";
            deviceStatus.className = "on";
            sendDataToBlynk("v0", 1);
            playAudioOnESP32("เปิดไฟแล้วครับ");
        } else if (action === "OFF") {
            deviceStatus.innerText = "OFF (MANUAL)";
            deviceStatus.className = "off";
            sendDataToBlynk("v0", 0);
            playAudioOnESP32("ปิดไฟแล้วครับ");
        } else {
            transcriptText.innerText += " (ไม่เข้าใจคำสั่ง กรุณาลองใหม่)";
            playAudioOnESP32("ไม่เข้าใจคำสั่งครับ กรุณาลองใหม่อีกครั้ง");
        }
    }

    function sendDataToBlynk(pin, value) {
        const url = `https://blynk.cloud/external/api/update?token=${BLYNK_TOKEN}&${pin}=${encodeURIComponent(value)}`;

        fetch(url)
            .then(response => {
                if (response.ok) {
                    console.log(`ส่งข้อมูลไปยัง Blynk (${pin}) สำเร็จ`);
                }
            })
            .catch(error => console.error("Error:", error));
    }
</script>

</body>
</html>
